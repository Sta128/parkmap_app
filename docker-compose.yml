services:
  frontend:
    build: ./frontend/react

    ports:
      - "5173:5173"

    volumes:
      - ./frontend/react:/app
      - /app/node_modules

    stdin_open: true
    tty: true

  backend:
    build: ./backend

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    stdin_open: true
    tty: true

    depends_on:
      - postgres

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smart_map
      POSTGRES_DB: car_data

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
